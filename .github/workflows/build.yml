name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      run_full_build:
        description: "Запустить полную сборку образа (часы)"
        type: boolean
        default: false

jobs:
  validate:
    name: Проверки репозитория
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Синтаксис скриптов
        run: |
          for f in scripts/*.sh; do
            case "$f" in *extract-stock-firmware.sh) continue;; esac
            bash -n "$f" && echo "ok: $f"
          done
          python3 -c "import ast;ast.parse(open('scripts/extract-stock-firmware.sh').read())"
          echo "ok: scripts/extract-stock-firmware.sh"

      - name: Профиль сборки — валидный YAML и обязательные поля
        run: |
          python3 - <<'PY'
          import yaml, sys
          p = yaml.safe_load(open("device/profiles/ax50.yml"))
          for k in ("profile", "target", "subtarget", "feeds", "packages", "diffconfig"):
              assert k in p, f"нет ключа {k}"
          assert p["profile"] == "TPLINK_AX50", p["profile"]
          assert p["target"] == "intel_mips" and p["subtarget"] == "xrx500"
          for f in p["feeds"]:
              assert f.get("name") and f.get("uri"), f
          print(f"профиль ок: {len(p['feeds'])} фидов, {len(p['packages'])} пакетов")
          PY

      - name: DTS компилируется
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq device-tree-compiler
          ./scripts/check-dts.sh

      - name: Доступность фидов и пина ядра
        run: |
          python3 - <<'PY' > /tmp/feeds.txt
          import yaml
          p = yaml.safe_load(open("device/profiles/ax50.yml"))
          for f in p["feeds"]:
              print(f["uri"], f.get("branch", ""))
          PY
          fail=0
          while read -r uri branch; do
            if [ -n "$branch" ]; then
              out=$(git ls-remote --heads "$uri" "$branch" || true)
            else
              out=$(git ls-remote --heads "$uri" || true)
            fi
            if [ -n "$out" ]; then echo "OK   $uri ${branch}"
            else echo "FAIL $uri ${branch}"; fail=1; fi
          done < /tmp/feeds.txt
          ref=$(grep -o 'CONFIG_KERNEL_GIT_REF="[0-9a-f]*"' device/profiles/ax50.yml | cut -d'"' -f2)
          uri=$(grep -o 'CONFIG_KERNEL_GIT_CLONE_URI="[^"]*"' device/profiles/ax50.yml | cut -d'"' -f2)
          mkdir -p /tmp/k && cd /tmp/k && git init -q .
          if git fetch --depth 1 "$uri" "$ref" >/dev/null 2>&1; then
            echo "OK   ядро $ref -> $(git show FETCH_HEAD:Makefile | sed -n '1,3p' | tr '\n' ' ')"
          else
            echo "FAIL ядро $ref недоступно"; fail=1
          fi
          exit $fail

  build:
    name: Полная сборка образа
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_build
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Освободить место на раннере
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Зависимости
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-yaml rsync unzip zlib1g-dev file wget \
            quilt subversion swig time device-tree-compiler libelf-dev ccache

      - name: Подготовка дерева
        run: ./scripts/10-setup-tree.sh

      - name: Сборка
        run: ./scripts/20-build.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ax50-images
          path: build/prplwrt/bin/targets/intel_mips/xrx500/*
          if-no-files-found: warn
