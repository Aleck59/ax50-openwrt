#
# Workflow 1: прошивка.
#
#   push в ветку / PR  -> проверки + сборка образа (артефакты в Actions)
#   тег v*             -> то же + GitHub Release с образами, SDK и модулями
#                         ядра; затем запускается workflow 2 (packages.yml),
#                         который собирает фид opkg для этого релиза.
#
# Выпуск версии:  git tag v1.0.0 && git push origin v1.0.0
#             или: Actions -> «Прошивка» -> Run workflow (ветка main),
#                  release_tag = v1.0.0 — тег и релиз создаст сам workflow.
#
name: Прошивка

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
    paths-ignore: [ '**.md', 'docs/**', '.claude/**', 'LICENSE', 'tools/**',
                    'config/feed-packages.txt', 'scripts/feed-*.sh',
                    '.github/workflows/packages.yml' ]
  pull_request:
    paths-ignore: [ '**.md', 'docs/**', '.claude/**', 'LICENSE', 'tools/**',
                    'config/feed-packages.txt', 'scripts/feed-*.sh',
                    '.github/workflows/packages.yml' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Выпустить релиз с этим тегом (v1.0.0) на текущем коммите; пусто — обычная сборка'
        required: false
        default: ''

# Тег релиза: push тега или ручной запуск с release_tag
env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

# Новый push не отменяет идущую сборку: следующая ждёт в очереди (в очереди
# остаётся только последняя).
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    name: Проверки
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Проверки (scripts/lint.sh)
        run: scripts/lint.sh

  build:
    name: Сборка
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: read
      actions: write   # удаление устаревших кэшей
    env:
      JOBS: 4
    steps:
      - name: Освободить место
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune -af > /dev/null || true
          df -h /

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Версия
        id: ver
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')"
          base="https://${owner}.github.io/${{ github.event.repository.name }}"
          if [ -n "$RELEASE_TAG" ]; then
            ver="$RELEASE_TAG"
            feed="$base/releases/$ver"
          else
            ver="$(git describe --tags --always)"
            feed="$base/snapshots/$ver"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "FEED_URL=$feed" >> "$GITHUB_ENV"
          echo "Версия: $ver, фид: $feed"

      - name: Кэш загрузок (dl/)
        uses: actions/cache@v5
        with:
          path: build/prplwrt/dl
          key: dl-${{ hashFiles('config/feeds.conf', 'config/versions.env', 'package/**/Makefile', 'patches/**') }}
          restore-keys: dl-

      - name: Ключ подписи фида
        env:
          USIGN_KEY: ${{ secrets.USIGN_KEY }}
        run: |
          if [ -n "$USIGN_KEY" ]; then
            mkdir -p build
            printf '%s\n' "$USIGN_KEY" > build/usign.key
            chmod 600 build/usign.key
            echo "USIGN_KEY_FILE=/work/build/usign.key" >> "$GITHUB_ENV"
            echo "Пакеты будут подписаны"
          else
            echo "::notice::Секрет USIGN_KEY не задан — фид не подписывается (см. docs/release.md)"
          fi

      # Образ сборки (Ubuntu 20.04 + зависимости) собирается ~10 минут — храним
      # его в кэше; scripts/docker.sh пересобирает только при смене Dockerfile.
      - name: Кэш образа сборки
        id: img-cache
        uses: actions/cache@v5
        with:
          path: build/docker-image.tar.zst
          key: docker-img-${{ runner.os }}-${{ hashFiles('docker/Dockerfile', 'scripts/docker.sh') }}

      - name: Загрузка образа из кэша
        if: steps.img-cache.outputs.cache-hit == 'true'
        run: zstd -dc build/docker-image.tar.zst | docker load

      - name: Подготовка дерева
        run: scripts/docker.sh scripts/prepare.sh

      - name: Сохранение образа в кэш
        if: steps.img-cache.outputs.cache-hit != 'true'
        run: docker save ax50-build | zstd -T0 -3 -q -o build/docker-image.tar.zst

      - name: Конфигурация
        env:
          WITH_KMODS: 1
          WITH_SDK: 1
        run: scripts/docker.sh scripts/configure.sh

      # Хост-утилиты и кросс-тулчейн зависят только от закреплённого дерева,
      # патчей базы, образа сборки и параметров тулчейна в .config.
      - name: Ключи кэша тулчейна
        id: keys
        run: |
          sum=$( { cat config/versions.env docker/Dockerfile
            cat patches/prplwrt/*.patch 2>/dev/null
            grep -E '^CONFIG_(TARGET_BOARD|TARGET_SUBTARGET|TARGET_ARCH_PACKAGES|CPU_TYPE|ARCH|TARGET_OPTIMIZATION|EXTRA_OPTIMIZATION|SOFT_FLOAT|USE_MIPS16|USE_MUSL|USE_GLIBC|BINUTILS_|GCC_|LIBC|TARGET_SUFFIX|TOOLCHAINOPTS|EXTERNAL_TOOLCHAIN|KERNEL_GIT|LINUX_)' build/prplwrt/.config
          } | sha256sum | cut -c1-40)
          echo "toolchain=toolchain-${{ runner.os }}-$sum" >> "$GITHUB_OUTPUT"

      # restore/save раздельно: кэш сохраняется сразу после сборки тулчейна,
      # а не в конце job — падение сборки пакетов его не теряет
      - name: Кэш хост-утилит и тулчейна
        id: tc-cache
        uses: actions/cache/restore@v5
        with:
          # stamp сборки tools в 19.07 лежит в staging_dir/target-*/stamp
          path: |
            build/prplwrt/staging_dir/host
            build/prplwrt/staging_dir/toolchain-*
            build/prplwrt/staging_dir/target-*/stamp/.tools_compile_*
          key: ${{ steps.keys.outputs.toolchain }}

      # Свежий checkout новее восстановленных stamp-файлов — без touch make
      # счёл бы утилиты и тулчейн устаревшими и собрал заново
      - name: Отметить кэш тулчейна актуальным
        if: steps.tc-cache.outputs.cache-hit == 'true'
        working-directory: build/prplwrt
        run: find staging_dir/host/stamp staging_dir/toolchain-*/stamp staging_dir/target-*/stamp -type f -exec touch {} +

      - name: Удалить устаревшие кэши
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ steps.keys.outputs.toolchain }}
          KEEP_IMG: docker-img-${{ runner.os }}-${{ hashFiles('docker/Dockerfile', 'scripts/docker.sh') }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 100 --json id,key \
              --jq '.[] | "\(.id) \(.key)"' |
          while read -r id key; do
            case "$key" in
            "$KEEP"|"$KEEP_IMG") ;;
            toolchain-*|docker-img-*) echo "удаляю $key"; gh cache delete "$id" --repo "$GITHUB_REPOSITORY" ;;
            esac
          done

      - name: Загрузка исходников
        run: scripts/docker.sh bash -c 'cd build/prplwrt && { make -j8 download || make -j1 download V=s; }'

      - name: Хост-утилиты и тулчейн
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          scripts/docker.sh scripts/build.sh tools/install toolchain/install \
            || scripts/docker.sh bash -c 'cd build/prplwrt && make -j1 V=s tools/install toolchain/install'

      - name: Сохранение тулчейна в кэш
        if: steps.tc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            build/prplwrt/staging_dir/host
            build/prplwrt/staging_dir/toolchain-*
            build/prplwrt/staging_dir/target-*/stamp/.tools_compile_*
          key: ${{ steps.keys.outputs.toolchain }}

      - name: Сборка
        id: build
        run: scripts/docker.sh scripts/build.sh

      # После успешной сборки ошибка сбора (например, нет SDK) валит job,
      # после неудачной — собираем что есть, для разбора.
      - name: Сбор артефактов
        if: always()
        env:
          WITH_SDK: 1
          BUILD_OK: ${{ steps.build.outcome == 'success' }}
        run: |
          rm -f build/usign.key
          if [ "$BUILD_OK" = true ]; then
            scripts/docker.sh scripts/collect.sh "$VERSION" /work/out
          else
            scripts/docker.sh scripts/collect.sh "$VERSION" /work/out || true
          fi
          ls -la out || true

      - name: Логи ошибок
        if: failure()
        run: |
          find build/prplwrt/logs -name '*.txt' -size +0 2>/dev/null | head -50 | while read -r f; do
            echo "::group::$f"; tail -60 "$f"; echo "::endgroup::"
          done

      - name: Артефакт — образы
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ax50-openwrt-${{ steps.ver.outputs.version }}
          path: |
            out/*.bin
            out/*.img
            out/*.manifest
            out/*-buildinfo.tar.gz
            out/sha256sums
          if-no-files-found: warn

      - name: Артефакт — SDK и пакеты (для фида)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ax50-openwrt-${{ steps.ver.outputs.version }}-sdk
          path: |
            out/*-sdk.tar.xz
            out/*-packages.tar.gz
          retention-days: 14

  release:
    name: Релиз
    needs: build
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          pattern: ax50-openwrt-${{ env.RELEASE_TAG }}*
          path: out
          merge-multiple: true

      # Ручной запуск: тега в репозитории ещё нет, release-notes.sh нужен локальный
      - name: Локальный тег
        run: git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null || git tag "$RELEASE_TAG"

      - name: Описание релиза
        run: scripts/release-notes.sh "$RELEASE_TAG" out > notes.md

      - name: Публикация
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          pre=""
          case "$tag" in *-*) pre="--prerelease" ;; esac
          # Тег уже есть (push тега) — проверить его; ручной запуск — создать
          # тег на собранном коммите
          if [ "${{ github.ref_type }}" = tag ]; then
            where="--verify-tag"
          else
            where="--target ${{ github.sha }}"
          fi
          ( cd out && sha256sum -- *.bin *.img *.manifest *.tar.* > sha256sums )
          gh release create "$tag" $pre $where \
            --title "AX50 OpenWrt $tag" --notes-file notes.md \
            out/*.bin out/*.img out/*.manifest out/*.tar.* out/sha256sums

      - name: Запуск сборки фида (workflow 2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run packages.yml --ref "$RELEASE_TAG" -f release_tag="$RELEASE_TAG"
