#
# Workflow 2: фид пакетов opkg.
#
# Запускается workflow прошивки после публикации релиза (или вручную) и
# собирает пакеты через SDK этого релиза. Результат:
#   * GitHub Pages: https://<owner>.github.io/<repo>/releases/dev/ — единый
#     адрес фида для всех версий прошивки (/etc/opkg/distfeeds.conf), каждый
#     релиз его перезаписывает;
#   * архив фида ax50-openwrt-<тег>-feed.tar.gz в том же релизе
#     (установка без интернета: распаковать на флешку и указать file://).
#
name: Фид пакетов

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег релиза прошивки (например v1.0.0)"
        required: true
        type: string

concurrency:
  group: packages-feed
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.release_tag }}

jobs:
  feed:
    name: Сборка фида
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      JOBS: 4
    steps:
      - name: Освободить место
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune -af > /dev/null || true
          df -h /

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: SDK и пакеты прошивки из релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p in
          gh release download "$TAG" -D in -p '*-sdk.tar.xz' -p '*-packages.tar.gz'
          ls -la in

      - name: Кэш загрузок SDK
        uses: actions/cache@v5
        with:
          path: build/sdk-dl
          key: sdk-dl-${{ hashFiles('config/feeds.conf', 'config/versions.env', 'config/feed-packages.txt', 'package/**/Makefile', 'patches/**') }}
          restore-keys: sdk-dl-

      - name: Ключ подписи
        env:
          USIGN_KEY: ${{ secrets.USIGN_KEY }}
        run: |
          if [ -n "$USIGN_KEY" ]; then
            mkdir -p build
            printf '%s\n' "$USIGN_KEY" > build/usign.key
            chmod 600 build/usign.key
            echo "USIGN_KEY_FILE=/work/build/usign.key" >> "$GITHUB_ENV"
          fi

      - name: Кэш образа сборки
        id: img-cache
        uses: actions/cache@v5
        with:
          path: build/docker-image.tar.zst
          key: docker-img-${{ runner.os }}-${{ hashFiles('docker/Dockerfile', 'scripts/docker.sh') }}

      - name: Загрузка образа из кэша
        if: steps.img-cache.outputs.cache-hit == 'true'
        run: zstd -dc build/docker-image.tar.zst | docker load

      - name: Сборка пакетов (SDK)
        run: |
          scripts/docker.sh scripts/feed-build.sh \
            /work/in/ax50-openwrt-$TAG-sdk.tar.xz \
            /work/in/ax50-openwrt-$TAG-packages.tar.gz \
            "$TAG" /work/site
          rm -f build/usign.key

      - name: Архив фида в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Фид публикуется по единому адресу releases/dev, независимо от версии
          mv "site/releases/$TAG" site/releases/dev
          tar -czf "ax50-openwrt-$TAG-feed.tar.gz" -C site/releases/dev .
          gh release upload "$TAG" "ax50-openwrt-$TAG-feed.tar.gz" --clobber

      - name: Страница сайта
        run: |
          scripts/feed-site.sh site dev "${{ github.repository }}" "$TAG"
          du -sh site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Публикация на GitHub Pages
    needs: feed
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Если Pages не включены
        if: failure()
        run: |
          echo "::warning::GitHub Pages не включены. Settings → Pages → Source: GitHub Actions, затем перезапустите этот workflow. Архив фида уже лежит в релизе."
