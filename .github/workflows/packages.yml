#
# Workflow 2: фид пакетов opkg.
#
# Запускается workflow прошивки после публикации релиза (или вручную) и
# собирает пакеты через SDK этого релиза. Результат:
#   * GitHub Pages: https://<owner>.github.io/<repo>/releases/<тег>/ —
#     адрес, прописанный в /etc/opkg/distfeeds.conf прошивки;
#   * архив фида ax50-openwrt-<тег>-feed.tar.gz в том же релизе
#     (установка без интернета: распаковать на флешку и указать file://).
#
name: Фид пакетов

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег релиза прошивки (например v1.0.0)"
        required: true
        type: string

concurrency:
  group: packages-feed
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.release_tag }}
  KEEP_RELEASES: 2

jobs:
  feed:
    name: Сборка фида
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      JOBS: 4
    steps:
      - name: Освободить место
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune -af > /dev/null || true
          df -h /

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: SDK и пакеты прошивки из релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p in
          gh release download "$TAG" -D in -p '*-sdk.tar.xz' -p '*-packages.tar.gz'
          ls -la in

      - name: Кэш загрузок SDK
        uses: actions/cache@v5
        with:
          path: build/sdk-dl
          key: sdk-dl-${{ hashFiles('config/feeds.conf', 'config/versions.env', 'config/feed-packages.txt', 'package/**/Makefile', 'patches/**') }}
          restore-keys: sdk-dl-

      - name: Ключ подписи
        env:
          USIGN_KEY: ${{ secrets.USIGN_KEY }}
        run: |
          if [ -n "$USIGN_KEY" ]; then
            mkdir -p build
            printf '%s\n' "$USIGN_KEY" > build/usign.key
            chmod 600 build/usign.key
            echo "USIGN_KEY_FILE=/work/build/usign.key" >> "$GITHUB_ENV"
          fi

      - name: Сборка пакетов (SDK)
        run: |
          scripts/docker.sh scripts/feed-build.sh \
            /work/in/ax50-openwrt-$TAG-sdk.tar.xz \
            /work/in/ax50-openwrt-$TAG-packages.tar.gz \
            "$TAG" /work/site
          rm -f build/usign.key

      - name: Архив фида в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "ax50-openwrt-$TAG-feed.tar.gz" -C "site/releases/$TAG" .
          gh release upload "$TAG" "ax50-openwrt-$TAG-feed.tar.gz" --clobber

      - name: Предыдущие релизы в составе сайта
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pages публикуется целиком, поэтому фиды прошлых релизов (их прошивки
          # всё ещё могут стоять на роутерах) кладём рядом из их архивов.
          gh release list --limit 20 --json tagName,isDraft \
              --jq '.[] | select(.isDraft | not) | .tagName' \
            | grep -vx "$TAG" | head -n $((KEEP_RELEASES - 1)) | while read -r old; do
              f="ax50-openwrt-$old-feed.tar.gz"
              gh release download "$old" -p "$f" -D old 2>/dev/null || continue
              mkdir -p "site/releases/$old"
              tar -xzf "old/$f" -C "site/releases/$old"
              echo "добавлен фид $old"
            done
          scripts/feed-site.sh site "$TAG" "${{ github.repository }}"
          du -sh site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Публикация на GitHub Pages
    needs: feed
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Если Pages не включены
        if: failure()
        run: |
          echo "::warning::GitHub Pages не включены. Settings → Pages → Source: GitHub Actions, затем перезапустите этот workflow. Архив фида уже лежит в релизе."
